<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registration Page</title>
    <link rel="stylesheet" type="text/css" href="../static/register_style.css" th:href="@{/register_style.css}" />
    <link rel="icon" type="image/x-icon" href="https://img.icons8.com/?size=100&id=pdp190Sk7cO8&format=png&color=000000" />
</head>
<body>
<div id="title">
    <h1>Student Management System</h1>
</div>
<div id="register-container">
    <h2>Register</h2>
    <form th:action="@{/register}" th:object="${register}" method="post">
        <input type="text" name="name" placeholder="Name" required/><br>
        <input type="text" name="student_id" placeholder="Student ID" required/><br>
        <input type="number" name="age" placeholder="Age" required/><br>
        <input type="text" name="username" placeholder="Username" required/><br>
        <input type="password" name="password" placeholder="Password" required/><br>
        <button type="submit" >Register</button>
    </form>

    <p th:if="${error}" th:text="${error}" style="color:red;"></p>

    <p>Already have an account?  <a href="/login">Login here</a></p>
</div>
</body>
</html>
