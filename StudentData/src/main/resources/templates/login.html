<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login Page</title>
    <link rel="stylesheet" type="text/css" href="../static/login_style.css" th:href="@{/login_style.css}" />
    <link rel="icon" type="image/x-icon" href="https://img.icons8.com/?size=100&id=pdp190Sk7cO8&format=png&color=000000" />
</head>
<body>
    <div id="title">
        <h1>Student Management System</h1>
    </div>
    <div id="login-container">
        <h2>Login</h2>
        <form th:action="@{/login}" th:object="${login}" method="post">
            <input type="text" name="username" placeholder="Username" required/><br>
            <input type="password" name="password" placeholder="Password" required/><br>
            <button type="submit">Login</button>
        </form>

        <p th:if="${error}" th:text="${error}" style="color: red"></p>
        
        <p>Don't have an account?  <a href="/register">Register here</a></p>
    </div>
</body>
</html>
